<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理画面のログイン</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans JP',sans-serif;background:#f2f2f4;color:#1a1a1a}
a{color:#bf3f1f}a:hover{color:#922d15}
</style>
</head>
<body>
<div style="width: 1280px; height: 900px; box-sizing: border-box; background: #f2f2f4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px">
  <form style="width: 440px; box-sizing: border-box; background: #ffffff; border-radius: 12px; padding: 40px; box-shadow: 0 2px 12px rgba(20,20,28,0.08); display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 24px; font-weight: 800">管理画面にログイン</h1>
      <p style="margin: 0; font-size: 14px; color: #48484a">本とタグを書き込めるのは、管理者トークンを持つ人だけです。</p>
    </div>
    <div role="alert" style="border: 1px solid #bf3f1f; background: #fff4f1; border-radius: 8px; padding: 12px 16px; font-size: 14px; color: #922d15">管理者トークンが違います。入力し直してください。</div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="token" style="font-size: 14px; font-weight: 700">管理者トークン</label>
      <input id="token" type="password" aria-invalid="true" autocomplete="current-password" style="height: 48px; box-sizing: border-box; border: 2px solid #bf3f1f; border-radius: 8px; padding: 0 16px; font-size: 16px; font-family: inherit">
    </div>
    <button type="submit" style="height: 48px; border: none; border-radius: 8px; background: #bf3f1f; color: #ffffff; font-size: 16px; font-weight: 700; font-family: inherit">ログイン</button>
  </form>
  <a href="#" style="font-size: 14px">公開画面へ戻る</a>
</div>
</body>
</html>
