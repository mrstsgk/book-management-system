<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タグの管理</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans JP',sans-serif;background:#f2f2f4;color:#1a1a1a}
a{color:#bf3f1f}a:hover{color:#922d15}
</style>
</head>
<body>
<div style="width: 1280px; height: 900px; box-sizing: border-box; background: #f2f2f4; display: flex; flex-direction: column; position: relative">
  <header style="height: 64px; background: #1a1a1a; color: #ffffff; display: flex; align-items: center; padding: 0 48px; gap: 40px">
    <a href="books.html" style="font-size: 18px; font-weight: 700; color: #ffffff; text-decoration: none; display: flex; align-items: center; gap: 10px">読んだ本 <span style="font-size: 12px; font-weight: 700; background: #ffffff; color: #1a1a1a; border-radius: 4px; padding: 2px 8px">管理</span></a>
    <nav aria-label="管理メニュー" style="display: flex; gap: 28px; font-size: 15px; flex-grow: 1">
      <a href="books.html" style="color: #d2d2d7; text-decoration: none; padding: 20px 0">本</a>
      <a href="tags.html" aria-current="page" style="color: #ffffff; font-weight: 700; text-decoration: none; border-bottom: 2px solid #ff7e5e; padding: 20px 0">タグ</a>
    </nav>
    <a href="#" style="color: #d2d2d7; font-size: 14px">公開画面を見る ↗</a>
  </header>

  <main style="padding: 40px 48px; display: flex; flex-direction: column; gap: 20px; max-width: 760px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 800">分野タグ</h1>

    <form style="background: #ffffff; border-radius: 12px; padding: 20px 24px; box-shadow: 0 2px 12px rgba(20,20,28,0.08); display: flex; flex-direction: column; gap: 6px">
      <label for="new-tag" style="font-size: 14px; font-weight: 700">タグを追加</label>
      <div style="display: flex; gap: 8px">
        <input id="new-tag" value="設計" aria-invalid="true" style="flex-grow: 1; height: 48px; box-sizing: border-box; border: 2px solid #bf3f1f; border-radius: 8px; padding: 0 16px; font-size: 16px; font-family: inherit">
        <button type="submit" style="height: 48px; padding: 0 24px; border: none; border-radius: 8px; background: #bf3f1f; color: #ffffff; font-size: 16px; font-weight: 700; font-family: inherit">追加</button>
      </div>
      <span style="font-size: 13px; color: #922d15">「設計」というタグはすでにあります</span>
    </form>

    <ul style="list-style: none; margin: 0; padding: 0; background: #ffffff; border-radius: 12px; box-shadow: 0 2px 12px rgba(20,20,28,0.08)">
      <li style="display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid #e5e5ea">
        <label for="rename-1" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">「設計」の新しい名前</label>
        <input id="rename-1" value="ソフトウェア設計" style="flex-grow: 1; height: 44px; box-sizing: border-box; border: 1px solid #6e6e73; border-radius: 8px; padding: 0 12px; font-size: 16px; font-family: inherit">
        <button type="button" style="height: 44px; padding: 0 16px; border: none; border-radius: 8px; background: #bf3f1f; color: #ffffff; font-size: 14px; font-weight: 700; font-family: inherit">保存</button>
        <button type="button" style="height: 44px; padding: 0 12px; border: none; background: transparent; color: #48484a; font-size: 14px; font-family: inherit">キャンセル</button>
      </li>
        <li style="display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid #e5e5ea">
          <span style="flex-grow: 1; font-size: 16px; font-weight: 700">データ</span>
          <span style="font-size: 13px; color: #48484a; width: 64px; text-align: right">2冊</span>
          <button type="button" style="height: 44px; padding: 0 12px; border: none; background: transparent; color: #bf3f1f; font-size: 14px; font-weight: 700; font-family: inherit">名前を変更</button>
          <button type="button" style="height: 44px; padding: 0 12px; border: none; background: transparent; color: #bf3f1f; font-size: 14px; font-weight: 700; font-family: inherit">削除</button>
        </li>
        <li style="display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid #e5e5ea">
          <span style="flex-grow: 1; font-size: 16px; font-weight: 700">クラウド</span>
          <span style="font-size: 13px; color: #48484a; width: 64px; text-align: right">1冊</span>
          <button type="button" style="height: 44px; padding: 0 12px; border: none; background: transparent; color: #bf3f1f; font-size: 14px; font-weight: 700; font-family: inherit">名前を変更</button>
          <button type="button" style="height: 44px; padding: 0 12px; border: none; background: transparent; color: #bf3f1f; font-size: 14px; font-weight: 700; font-family: inherit">削除</button>
        </li>
        <li style="display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid #e5e5ea">
          <span style="flex-grow: 1; font-size: 16px; font-weight: 700">プロダクト</span>
          <span style="font-size: 13px; color: #48484a; width: 64px; text-align: right">1冊</span>
          <button type="button" style="height: 44px; padding: 0 12px; border: none; background: transparent; color: #bf3f1f; font-size: 14px; font-weight: 700; font-family: inherit">名前を変更</button>
          <button type="button" style="height: 44px; padding: 0 12px; border: none; background: transparent; color: #bf3f1f; font-size: 14px; font-weight: 700; font-family: inherit">削除</button>
        </li>
        <li style="display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid #e5e5ea">
          <span style="flex-grow: 1; font-size: 16px; font-weight: 700">ネットワーク</span>
          <span style="font-size: 13px; color: #48484a; width: 64px; text-align: right">0冊</span>
          <button type="button" style="height: 44px; padding: 0 12px; border: none; background: transparent; color: #bf3f1f; font-size: 14px; font-weight: 700; font-family: inherit">名前を変更</button>
          <button type="button" style="height: 44px; padding: 0 12px; border: none; background: transparent; color: #bf3f1f; font-size: 14px; font-weight: 700; font-family: inherit">削除</button>
        </li>
    </ul>
  </main>

  <div style="position: absolute; left: 0; top: 0; width: 1280px; height: 900px; background: rgba(20,20,28,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 260px; box-sizing: border-box">
    <div role="dialog" aria-modal="true" aria-labelledby="del-tag" style="width: 480px; box-sizing: border-box; background: #ffffff; border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 6px 24px rgba(20,20,28,0.25)">
      <h2 id="del-tag" style="margin: 0; font-size: 20px; font-weight: 800">「データ」を削除しますか？</h2>
      <p style="margin: 0; font-size: 15px; line-height: 1.8">このタグが付いている2冊から外れます。本は消えません。</p>
      <div style="display: flex; justify-content: flex-end; gap: 12px">
        <button type="button" style="height: 44px; padding: 0 20px; border: 1px solid #9b9ba2; border-radius: 8px; background: #ffffff; color: #1a1a1a; font-size: 15px; font-family: inherit">キャンセル</button>
        <button type="button" style="height: 44px; padding: 0 20px; border: none; border-radius: 8px; background: #bf3f1f; color: #ffffff; font-size: 15px; font-weight: 700; font-family: inherit">削除する</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
