parameters:
  - name: id
    in: path
    required: true
    description: 読んだ本の ID
    schema:
      type: integer
      format: int64
      minimum: 1
    example: 1
get:
  operationId: readBook
  summary: Read a book
  description: 読んだ本の詳細（書誌・書影・Amazon リンク・一言まとめ・感想・評価・分野タグ）を返す。
  tags:
    - book
  security: []
  x-error-codes:
    - code: bookNotFound
      status: 404
      rule: 指定した ID の本が無い
      message: この本は見つかりませんでした
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../schemas/BookResponse.yaml
    '400':
      description: 'path・query パラメータの入力検証の違反（errors[{field, rule}]）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '404':
      description: '対象が無い（code: bookNotFound）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '500':
      description: 'Internal Server Error'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
