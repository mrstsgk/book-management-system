type: object
required:
  - id
  - isbn
  - title
  - authors
  - publisher
  - publishedOn
  - amazonUrl
  - coverUrl
  - coverSource
  - titleOverride
  - summary
  - tags
  - comment
  - rating
  - version
properties:
  id:
    type: integer
    format: int64
    example: 1
  isbn:
    type: string
    example: '9784873118703'
  title:
    type: string
    description: 表示する書名（上書きがあればそれ、無ければ外部カタログの書名）
    example: データ指向アプリケーションデザイン
  authors:
    type: string
    example: Kleppmann,Martin 斉藤,太郎 玉川,竜司
  publisher:
    type: string
    example: オーム社
  publishedOn:
    type: string
    description: 出版日（外部カタログの表記のまま。例 201907）
    example: '201907'
  amazonUrl:
    type: string
    nullable: true
    description: ISBN から導出する。ISBN-10 の形にできなければ null
    example: https://www.amazon.co.jp/dp/4873118700
  coverUrl:
    type: string
    nullable: true
    description: 提供元がホストする書影の URL。書影が無ければ null
    example: https://cover.openbd.jp/9784873118703.jpg
  coverSource:
    type: string
    nullable: true
    description: 書影の提供元（Domain の CoverSource が値を保証する）。書影が無ければ null
    enum:
      - openbd
    example: openbd
  titleOverride:
    type: string
    nullable: true
    description: 自分で上書きした書名。上書きしていなければ null
  summary:
    type: string
    example: 分散データの設計を体系的に学べる
  tags:
    type: array
    description: 付いている分野タグの名前
    items:
      type: string
    example:
      - データベース
  comment:
    type: string
    example: 分散システムの設計を体系的に学べた
  rating:
    type: integer
    minimum: 1
    maximum: 5
    example: 5
  version:
    type: integer
    description: 同時編集を見つけるための版（更新のたびに増える）
    example: 1
