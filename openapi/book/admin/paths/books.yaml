get:
  operationId: searchBooks
  summary: Search books
  description: |
    読んだ本を新しく登録した順に返す。q と tagId は同時に使える（両方を満たす本）。
    total は条件に合う、取得範囲外も含む総件数。感想の本文は詳細で返す。存在しない tagId は 0 件。
    q の文字数（前後の空白を除いて 100 文字まで）は VO が判定し、超えたら 400（errors なし）。
  tags:
    - book
  security:
    - adminSession: []
  parameters:
    - name: limit
      in: query
      required: false
      description: 取得件数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: offset
      in: query
      required: false
      description: 取得開始位置
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: q
      in: query
      required: false
      description: 書名（上書きがあれば上書き）・著者の部分一致。大文字小文字を区別しない。前後の空白を除いて空なら検索しない
      schema:
        type: string
    - name: tagId
      in: query
      required: false
      description: この分野タグが付いた本だけにする
      schema:
        type: integer
        format: int64
        minimum: 1
  x-error-codes:
    - code: unauthenticated
      status: 401
      rule: ログインしていない、またはセッションの期限が切れている
      message: （ログイン画面へ移る。文言は出さない）
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../schemas/SearchBooksResponse.yaml
    '400':
      description: 'path・query パラメータの入力検証の違反（errors[{field, rule}]）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '401':
      description: '未ログイン・セッションの期限切れ（code: unauthenticated）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '500':
      description: 'Internal Server Error'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
post:
  operationId: registerBook
  summary: Register a book
  description: |
    読んだ本を登録する。書誌と書影は ISBN で外部カタログ（openBD）から取得する。
    ISBN の形式（13 桁か 10 桁・チェックディジット）は VO が判定し、違反は errors の rule format。
    独立して判定できる入力・VO・相関ルールの違反はすべて errors に返す（順不同）。詳細は docs/architecture.md §4。
  tags:
    - book
  security:
    - adminSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/RegisterBookRequest.yaml
  x-correlation-rules:
    - id: isbnDuplicated
      field: isbn
      rule: 登録する ISBN の本は未登録である
      message: MSG-A01
    - id: isbnNotInCatalog
      field: isbn
      rule: 登録する ISBN は外部カタログに存在する（外部カタログの照会は他の違反が無いときだけ行う）
      message: MSG-A02
    - id: tagIdsNotFound
      field: tagIds
      rule: 指定した分野タグ ID はすべて存在する
      message: MSG-A03
    - id: tagIdsDuplicated
      field: tagIds
      rule: 分野タグ ID に重複が無い
      message: 入力を見直してください
  x-error-codes:
    - code: unauthenticated
      status: 401
      rule: ログインしていない、またはセッションの期限が切れている
      message: （ログイン画面へ移る。文言は出さない）
    - code: isbnDuplicated
      status: 409
      rule: 同じ ISBN の本が同時に登録された（DB の一意制約。通常は 400 の isbnDuplicated になる）
      message: MSG-A01
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../schemas/BookResponse.yaml
    '400':
      description: '入力検証・VO・相関ルールの違反（errors に独立して判定できるものをすべて。順不同）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '401':
      description: '未ログイン・セッションの期限切れ（code: unauthenticated）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '403':
      description: 'Origin が自分と一致しない（CSRF 対策）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '409':
      description: '競合（code: isbnDuplicated）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '500':
      description: 'Internal Server Error'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
