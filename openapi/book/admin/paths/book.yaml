parameters:
  - name: id
    in: path
    required: true
    description: 読んだ本の ID
    schema:
      type: integer
      format: int64
      minimum: 1
    example: 1
put:
  operationId: updateBook
  summary: Update a book
  description: |
    一言まとめ・感想・評価・書名の上書き・分野タグを更新する（全体の置き換え）。
    あわせて書誌と書影を外部カタログから取り直す（取り直せなければ今のまま）。
    titleOverride を省略・空（空白だけも）にすると上書きを外し、tagIds を省略・空にすると分野タグをすべて外す。
    version が一致しなければ 409（他で先に更新された）。
  tags:
    - book
  security:
    - adminSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/UpdateBookRequest.yaml
  x-correlation-rules:
    - id: tagIdsNotFound
      field: tagIds
      rule: 指定した分野タグ ID はすべて存在する
      message: MSG-A03
    - id: tagIdsDuplicated
      field: tagIds
      rule: 分野タグ ID に重複が無い
      message: 入力を見直してください
  x-error-codes:
    - code: unauthenticated
      status: 401
      rule: ログインしていない、またはセッションの期限が切れている
      message: （ログイン画面へ移る。文言は出さない）
    - code: bookNotFound
      status: 404
      rule: 指定した ID の本が無い
      message: この本は見つかりませんでした
    - code: versionConflict
      status: 409
      rule: version が保存されている版と一致しない（他で先に更新された）
      message: MSG-A06
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../public/schemas/BookResponse.yaml
    '400':
      description: '入力検証・VO・相関ルールの違反（errors に独立して判定できるものをすべて。順不同）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '401':
      description: '未ログイン・セッションの期限切れ（code: unauthenticated）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '403':
      description: 'Origin が自分と一致しない（CSRF 対策）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '404':
      description: '対象が無い（code: bookNotFound）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '409':
      description: '競合（code: versionConflict）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '500':
      description: 'Internal Server Error'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
delete:
  operationId: deleteBook
  summary: Delete a book
  description: 読んだ本を削除する。
  tags:
    - book
  security:
    - adminSession: []
  x-error-codes:
    - code: unauthenticated
      status: 401
      rule: ログインしていない、またはセッションの期限が切れている
      message: （ログイン画面へ移る。文言は出さない）
    - code: bookNotFound
      status: 404
      rule: 指定した ID の本が無い
      message: この本は見つかりませんでした
  responses:
    '204':
      description: No Content
    '400':
      description: 'path・query パラメータの入力検証の違反（errors[{field, rule}]）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '401':
      description: '未ログイン・セッションの期限切れ（code: unauthenticated）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '403':
      description: 'Origin が自分と一致しない（CSRF 対策）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '404':
      description: '対象が無い（code: bookNotFound）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '500':
      description: 'Internal Server Error'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
