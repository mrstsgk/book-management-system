post:
  operationId: registerTag
  summary: Register a tag
  description: 分野タグを追加する。同じ名前のタグは追加できない（400 の tagNameDuplicated）。
  tags:
    - tag
  security:
    - adminSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/RegisterTagRequest.yaml
  x-correlation-rules:
    - id: tagNameDuplicated
      field: name
      rule: タグ名は他のタグと重複しない
      message: MSG-A04
  x-error-codes:
    - code: unauthenticated
      status: 401
      rule: ログインしていない、またはセッションの期限が切れている
      message: （ログイン画面へ移る。文言は出さない）
    - code: tagNameDuplicated
      status: 409
      rule: 同じ名前のタグが同時に追加された（DB の一意制約。通常は 400 の tagNameDuplicated になる）
      message: MSG-A04
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../public/schemas/TagResponse.yaml
    '400':
      description: '入力検証・VO・相関ルールの違反（errors に独立して判定できるものをすべて。順不同）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '401':
      description: '未ログイン・セッションの期限切れ（code: unauthenticated）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '403':
      description: 'Origin が自分と一致しない（CSRF 対策）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '409':
      description: '競合（code: tagNameDuplicated）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '500':
      description: 'Internal Server Error'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
