parameters:
  - name: id
    in: path
    required: true
    description: 分野タグの ID
    schema:
      type: integer
      format: int64
      minimum: 1
    example: 1
put:
  operationId: renameTag
  summary: Rename a tag
  description: |
    分野タグの名前を変える。自分以外に同じ名前のタグがあれば 400 の tagNameDuplicated。
    version が一致しなければ 409（他で先に更新された）。
  tags:
    - tag
  security:
    - adminSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/RenameTagRequest.yaml
  x-correlation-rules:
    - id: tagNameDuplicated
      field: name
      rule: タグ名は自分以外のタグと重複しない
      message: MSG-A04
  x-error-codes:
    - code: unauthenticated
      status: 401
      rule: ログインしていない、またはセッションの期限が切れている
      message: （ログイン画面へ移る。文言は出さない）
    - code: tagNotFound
      status: 404
      rule: 指定した ID のタグが無い
      message: このタグは見つかりませんでした
    - code: versionConflict
      status: 409
      rule: version が保存されている版と一致しない（他で先に更新された）
      message: MSG-A08
    - code: tagNameDuplicated
      status: 409
      rule: 同じ名前に同時に変えられた（DB の一意制約。通常は 400 の tagNameDuplicated になる）
      message: MSG-A04
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../public/schemas/TagResponse.yaml
    '400':
      description: '入力検証・VO・相関ルールの違反（errors に独立して判定できるものをすべて。順不同）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '401':
      description: '未ログイン・セッションの期限切れ（code: unauthenticated）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '403':
      description: 'Origin が自分と一致しない（CSRF 対策）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '404':
      description: '対象が無い（code: tagNotFound）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '409':
      description: '競合（code: versionConflict / tagNameDuplicated）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '500':
      description: 'Internal Server Error'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
delete:
  operationId: deleteTag
  summary: Delete a tag
  description: 分野タグを削除する。付いていた本からは自動で外れる（本は消えない）。
  tags:
    - tag
  security:
    - adminSession: []
  x-error-codes:
    - code: unauthenticated
      status: 401
      rule: ログインしていない、またはセッションの期限が切れている
      message: （ログイン画面へ移る。文言は出さない）
    - code: tagNotFound
      status: 404
      rule: 指定した ID のタグが無い
      message: このタグは見つかりませんでした
  responses:
    '204':
      description: No Content
    '400':
      description: 'path・query パラメータの入力検証の違反（errors[{field, rule}]）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '401':
      description: '未ログイン・セッションの期限切れ（code: unauthenticated）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '403':
      description: 'Origin が自分と一致しない（CSRF 対策）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '404':
      description: '対象が無い（code: tagNotFound）'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
    '500':
      description: 'Internal Server Error'
      content:
        application/json:
          schema:
            $ref: ../../../common/schemas/ErrorResponse.yaml
