name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'backend/api/docs/**'
      - '.github/workflows/frontend-ci.yml'
      - '.mise.toml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'backend/api/docs/**'
      - '.github/workflows/frontend-ci.yml'
      - '.mise.toml'

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level high
        # 既存依存（react-router / jsdom>undici / ESLint プラグイン配下等）に
        # high が 7 件あり、そのままでは全 PR が落ちるため一時的に非ブロッキング。
        # 依存更新で解消したらこの行を削除してゲート化する
        continue-on-error: true

      - name: OpenAPI TypeScript drift check
        run: pnpm gen:api:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook
