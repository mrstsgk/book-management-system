services:
  db:
    image: postgres:17
    container_name: book-management-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: book_management
    volumes:
      - book_management_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d book_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for cover images. Pinned to 4.9: later images are the
  # Pro edition and refuse to start without LOCALSTACK_AUTH_TOKEN.
  s3:
    image: localstack/localstack:4.9
    container_name: book-management-s3
    # Loopback only: LocalStack does not verify request signatures, so anyone who
    # can reach this port could read or overwrite the images.
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-northeast-1
    volumes:
      - ./localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
      - ./localstack/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket book-images"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  book_management_pg:
