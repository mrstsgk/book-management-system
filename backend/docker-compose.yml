services:
  db:
    image: postgres:17
    container_name: book-management-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: book_management
    volumes:
      - book_management_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d book_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  book_management_pg:
