basePath: /
definitions:
  AuthorBookResponse:
    properties:
      id:
        example: 1
        type: integer
      price:
        example: 1500
        type: integer
      status:
        enum:
        - 1
        - 2
        example: 1
        type: integer
      title:
        example: 人間失格
        type: string
    type: object
  AuthorResponse:
    properties:
      birthDate:
        example: "1909-06-19"
        type: string
      id:
        example: 1
        type: integer
      name:
        example: 太宰治
        type: string
      version:
        example: 1
        type: integer
    type: object
  BookAuthorResponse:
    properties:
      birthDate:
        example: "1909-06-19"
        type: string
      id:
        example: 1
        type: integer
      name:
        example: 太宰治
        type: string
      version:
        example: 1
        type: integer
    type: object
  BookResponse:
    properties:
      amazonUrl:
        example: https://www.amazon.co.jp/dp/4101006059
        type: string
      authors:
        items:
          $ref: '#/definitions/BookAuthorResponse'
        type: array
      id:
        example: 1
        type: integer
      imageUrl:
        description: ImageURL is a presigned URL valid for 15 minutes; fetch the book
          again for a new one.
        example: http://localhost:4566/book-images/books/1/abc.png?X-Amz-Expires=900
        type: string
      price:
        example: 1500
        type: integer
      status:
        enum:
        - 1
        - 2
        example: 1
        type: integer
      title:
        example: 人間失格
        type: string
      version:
        example: 1
        type: integer
    type: object
  CreateAuthorRequest:
    properties:
      birthDate:
        example: "1909-06-19"
        type: string
      name:
        example: 太宰治
        maxLength: 100
        type: string
    required:
    - name
    type: object
  CreateBookRequest:
    properties:
      amazonUrl:
        example: https://www.amazon.co.jp/dp/4101006059
        maxLength: 2048
        type: string
      authorIds:
        items:
          type: integer
        minItems: 1
        type: array
      price:
        example: 1500
        maximum: 99999999
        minimum: 0
        type: integer
      status:
        enum:
        - 1
        - 2
        example: 1
        type: integer
      title:
        example: 人間失格
        maxLength: 255
        type: string
    required:
    - authorIds
    - price
    - status
    - title
    type: object
  ErrorResponse:
    properties:
      errors:
        description: Field-level details; only set for request validation errors.
        items:
          $ref: '#/definitions/FieldError'
        type: array
      message:
        example: invalid
        type: string
    type: object
  FieldError:
    properties:
      field:
        example: title
        type: string
      rule:
        example: required
        type: string
    type: object
  UpdateAuthorRequest:
    properties:
      birthDate:
        example: "1909-06-19"
        type: string
      name:
        example: 太宰治
        maxLength: 100
        type: string
      version:
        example: 1
        type: integer
    required:
    - name
    - version
    type: object
  UpdateBookRequest:
    properties:
      amazonUrl:
        description: Omitted or null clears the link (PUT replaces the whole book).
        example: https://www.amazon.co.jp/dp/4101006059
        maxLength: 2048
        type: string
      authorIds:
        items:
          type: integer
        minItems: 1
        type: array
      price:
        example: 1500
        maximum: 99999999
        minimum: 0
        type: integer
      status:
        enum:
        - 1
        - 2
        example: 1
        type: integer
      title:
        example: 人間失格
        maxLength: 255
        type: string
      version:
        example: 1
        type: integer
    required:
    - authorIds
    - price
    - status
    - title
    - version
    type: object
info:
  contact: {}
  title: Book Management System API
  version: 0.1.0
paths:
  /api/authors:
    post:
      consumes:
      - application/json
      description: 生年月日は現在より過去日付
      parameters:
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CreateAuthorRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuthorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: 著者を作成する
      tags:
      - authors
  /api/authors/{id}:
    put:
      consumes:
      - application/json
      description: 生年月日は現在より過去日付。version が一致しない場合は 409
      parameters:
      - description: 著者ID
        in: path
        name: id
        required: true
        type: integer
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpdateAuthorRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuthorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: 著者を更新する
      tags:
      - authors
  /api/authors/{id}/books:
    get:
      description: 書籍が見つからない場合は空配列を返す
      parameters:
      - description: 著者ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/AuthorBookResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: 著者に紐づく書籍一覧を取得する
      tags:
      - authors
  /api/books:
    post:
      consumes:
      - application/json
      description: 書籍価格は0以上、著者は1人以上（重複不可・存在する著者のみ）
      parameters:
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CreateBookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: 書籍を作成する
      tags:
      - books
  /api/books/{id}:
    get:
      description: imageUrl は15分間有効な署名付きURL
      parameters:
      - description: 書籍ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: 書籍を取得する
      tags:
      - books
    put:
      consumes:
      - application/json
      description: 出版済みから未出版には変更できない。version が一致しない場合は 409
      parameters:
      - description: 書籍ID
        in: path
        name: id
        required: true
        type: integer
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpdateBookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: 書籍を更新する
      tags:
      - books
  /api/books/{id}/image:
    post:
      consumes:
      - multipart/form-data
      description: JPEG / PNG / WebP、5MB以下。既存の画像は差し替える。種別はファイルの中身から判定する
      parameters:
      - description: 書籍ID
        in: path
        name: id
        required: true
        type: integer
      - description: 表紙画像
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: 書籍の表紙画像をアップロードする
      tags:
      - books
swagger: "2.0"
