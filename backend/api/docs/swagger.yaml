basePath: /
definitions:
  AuthorBookResponse:
    properties:
      id:
        example: 1
        type: integer
      price:
        example: 1500
        type: integer
      status:
        enum:
        - 1
        - 2
        example: 1
        type: integer
      title:
        example: 人間失格
        type: string
    type: object
  AuthorResponse:
    properties:
      birthDate:
        example: "1909-06-19"
        type: string
      id:
        example: 1
        type: integer
      name:
        example: 太宰治
        type: string
      version:
        example: 1
        type: integer
    type: object
  BookAuthorResponse:
    properties:
      birthDate:
        example: "1909-06-19"
        type: string
      id:
        example: 1
        type: integer
      name:
        example: 太宰治
        type: string
      version:
        example: 1
        type: integer
    type: object
  BookListAuthorResponse:
    properties:
      id:
        example: 1
        type: integer
      name:
        example: Martin Kleppmann
        type: string
    type: object
  BookListItemResponse:
    properties:
      amazonUrl:
        description: AmazonURL is derived from the ISBN; null when there is no ISBN
          (or no ISBN-10 form).
        example: https://www.amazon.co.jp/dp/4873118700
        type: string
      authors:
        items:
          $ref: '#/definitions/BookListAuthorResponse'
        type: array
      coverSource:
        enum:
        - openbd
        - rakuten
        example: openbd
        type: string
      coverUrl:
        description: CoverURL is the provider-hosted image; show it as-is with the
          credit for CoverSource.
        example: https://cover.openbd.jp/9784873118703.jpg
        type: string
      id:
        example: 1
        type: integer
      isbn:
        example: "9784873118703"
        type: string
      price:
        example: 4600
        type: integer
      status:
        enum:
        - 1
        - 2
        example: 2
        type: integer
      title:
        example: データ指向アプリケーションデザイン
        type: string
    type: object
  BookListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/BookListItemResponse'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 1
        type: integer
    type: object
  BookResponse:
    properties:
      amazonUrl:
        description: AmazonURL is derived from the ISBN; null when there is no ISBN
          (or no ISBN-10 form).
        example: https://www.amazon.co.jp/dp/4873118700
        type: string
      authors:
        items:
          $ref: '#/definitions/BookAuthorResponse'
        type: array
      coverSource:
        enum:
        - openbd
        - rakuten
        example: openbd
        type: string
      coverUrl:
        description: CoverURL is the provider-hosted image; show it as-is with the
          credit for CoverSource.
        example: https://cover.openbd.jp/9784873118703.jpg
        type: string
      id:
        example: 1
        type: integer
      isbn:
        example: "9784873118703"
        type: string
      price:
        example: 1500
        type: integer
      status:
        enum:
        - 1
        - 2
        example: 1
        type: integer
      title:
        example: 人間失格
        type: string
      version:
        example: 1
        type: integer
    type: object
  CatalogResponse:
    properties:
      amazonUrl:
        example: https://www.amazon.co.jp/dp/4873118700
        type: string
      authors:
        description: Authors is the provider's raw text and may include translators;
          the user picks the authors.
        example: Kleppmann,Martin 斉藤,太郎 玉川,竜司
        type: string
      coverSource:
        enum:
        - openbd
        - rakuten
        example: openbd
        type: string
      coverUrl:
        example: https://cover.openbd.jp/9784873118703.jpg
        type: string
      isbn:
        example: "9784873118703"
        type: string
      price:
        example: 4600
        type: integer
      publishedOn:
        example: "201907"
        type: string
      publisher:
        example: オライリー・ジャパン
        type: string
      title:
        example: データ指向アプリケーションデザイン
        type: string
    type: object
  CreateAuthorRequest:
    properties:
      birthDate:
        example: "1909-06-19"
        type: string
      name:
        example: 太宰治
        maxLength: 100
        type: string
    required:
    - name
    type: object
  CreateBookRequest:
    properties:
      authorIds:
        items:
          type: integer
        minItems: 1
        type: array
      isbn:
        description: ISBN (13 or 10 digits, hyphens allowed). The cover is looked
          up by it on save.
        example: "9784873118703"
        maxLength: 17
        type: string
      price:
        example: 1500
        maximum: 99999999
        minimum: 0
        type: integer
      status:
        enum:
        - 1
        - 2
        example: 1
        type: integer
      title:
        example: 人間失格
        maxLength: 255
        type: string
    required:
    - authorIds
    - price
    - status
    - title
    type: object
  ErrorResponse:
    properties:
      errors:
        description: Field-level details; only set for request validation errors.
        items:
          $ref: '#/definitions/FieldError'
        type: array
      message:
        example: invalid
        type: string
    type: object
  FieldError:
    properties:
      field:
        example: title
        type: string
      rule:
        example: required
        type: string
    type: object
  UpdateAuthorRequest:
    properties:
      birthDate:
        example: "1909-06-19"
        type: string
      name:
        example: 太宰治
        maxLength: 100
        type: string
      version:
        example: 1
        type: integer
    required:
    - name
    - version
    type: object
  UpdateBookRequest:
    properties:
      authorIds:
        items:
          type: integer
        minItems: 1
        type: array
      isbn:
        description: Omitted or null clears the ISBN and its cover (PUT replaces the
          whole book).
        example: "9784873118703"
        maxLength: 17
        type: string
      price:
        example: 1500
        maximum: 99999999
        minimum: 0
        type: integer
      status:
        enum:
        - 1
        - 2
        example: 1
        type: integer
      title:
        example: 人間失格
        maxLength: 255
        type: string
      version:
        example: 1
        type: integer
    required:
    - authorIds
    - price
    - status
    - title
    - version
    type: object
info:
  contact: {}
  title: Book Management System API
  version: 0.1.0
paths:
  /api/authors:
    post:
      consumes:
      - application/json
      description: 生年月日は現在より過去日付
      parameters:
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CreateAuthorRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuthorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: 著者を作成する
      tags:
      - authors
  /api/authors/{id}:
    put:
      consumes:
      - application/json
      description: 生年月日は現在より過去日付。version が一致しない場合は 409
      parameters:
      - description: 著者ID
        in: path
        name: id
        required: true
        type: integer
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpdateAuthorRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuthorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: 著者を更新する
      tags:
      - authors
  /api/authors/{id}/books:
    get:
      description: 書籍が見つからない場合は空配列を返す
      parameters:
      - description: 著者ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/AuthorBookResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: 著者に紐づく書籍一覧を取得する
      tags:
      - authors
  /api/books:
    get:
      description: 書籍ID昇順。total は取得範囲外も含む総件数。amazonUrl は ISBN から導出し、coverUrl は提供元（coverSource）の画像で、楽天の場合は画面にクレジット表示が必要
      parameters:
      - description: 取得件数（1〜100、既定20）
        in: query
        name: limit
        type: integer
      - description: 取得開始位置（0以上、既定0）
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BookListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: 書籍一覧を取得する
      tags:
      - books
    post:
      consumes:
      - application/json
      description: 書籍価格は0以上、著者は1人以上（重複不可・存在する著者のみ）
      parameters:
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CreateBookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: 書籍を作成する
      tags:
      - books
  /api/books/{id}:
    get:
      description: amazonUrl は ISBN から導出する。coverUrl は提供元（coverSource）がホストする画像で、楽天の場合は画面にクレジット表示が必要
      parameters:
      - description: 書籍ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: 書籍を取得する
      tags:
      - books
    put:
      consumes:
      - application/json
      description: 出版済みから未出版には変更できない。version が一致しない場合は 409
      parameters:
      - description: 書籍ID
        in: path
        name: id
        required: true
        type: integer
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpdateBookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: 書籍を更新する
      tags:
      - books
  /api/catalog/{isbn}:
    get:
      description: 書籍登録の入力補助。openBD を優先し、書影が無ければ楽天ブックスで補う。著者は提供元の文字列のまま返す
      parameters:
      - description: ISBN（13桁または10桁。ハイフン可）
        in: path
        name: isbn
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CatalogResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: ISBNから書誌情報と書影を取得する
      tags:
      - catalog
swagger: "2.0"
